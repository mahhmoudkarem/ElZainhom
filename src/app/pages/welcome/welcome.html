<div
  dir="rtl"
  class="min-h-screen bg-[#0D0D0B] flex items-center justify-center px-4 py-8 relative overflow-hidden"
>

  <!-- Background Decorations -->
  <div
    class="absolute -top-40 -right-40 w-96 h-96 bg-[#F20D18]/10 rounded-full blur-3xl"
  ></div>

  <div
    class="absolute -bottom-40 -left-40 w-96 h-96 bg-[#F20D18]/10 rounded-full blur-3xl"
  ></div>

  <!-- Main Card -->
  <div
    class="relative z-10 w-full max-w-md bg-white rounded-3xl shadow-2xl overflow-hidden"
  >

    <!-- Red Top -->
    <div class="h-2 bg-[#F20D18]"></div>

    <div class="px-6 sm:px-10 py-8">

      <!-- Logo -->
      <div class="flex justify-center mb-6">

        <img
          src="images/logo-transparent.png"
          alt="الزينهم للدواجن"
          class="w-44 sm:w-52 h-auto object-contain"
        />

      </div>

      <!-- Welcome Text -->
      <div class="text-center mb-8">

        <h1
          class="text-2xl sm:text-3xl font-extrabold text-[#0D0D0B] mb-2"
        >
          أهلاً بك في الزينهم للدواجن
        </h1>

        <p class="text-[#F20D18] font-bold text-lg mb-2">
          يسعدنا انضمامك إلينا
        </p>

        <p class="text-gray-500 text-sm">
          أدخل بياناتك للمتابعة إلى الموقع
        </p>

      </div>

      <!-- Form -->
      <form
        (ngSubmit)="submit()"
        #welcomeForm="ngForm"
        class="space-y-5"
      >

        <!-- Full Name -->
        <div>

          <label
            for="fullName"
            class="block text-sm font-bold text-[#0D0D0B] mb-2"
          >
            الاسم بالكامل
          </label>

          <div class="relative">

            <i
              class="fa-solid fa-user absolute right-4 top-1/2 -translate-y-1/2 text-[#F20D18]"
            ></i>

            <input
              id="fullName"
              type="text"
              name="fullName"
              [(ngModel)]="user.fullName"
              placeholder="أدخل الاسم بالكامل"
              autocomplete="name"
              class="w-full h-14 pr-11 pl-4 rounded-xl border border-gray-200 bg-gray-50 text-[#0D0D0B] placeholder-gray-400 outline-none transition-all focus:bg-white focus:border-[#F20D18] focus:ring-4 focus:ring-[#F20D18]/10"
            />

          </div>

        </div>

        <!-- Phone -->
        <div>

          <label
            for="phone"
            class="block text-sm font-bold text-[#0D0D0B] mb-2"
          >
            رقم الهاتف
          </label>

          <div class="relative">

            <i
              class="fa-solid fa-phone absolute right-4 top-1/2 -translate-y-1/2 text-[#F20D18]"
            ></i>

            <input
              id="phone"
              type="tel"
              name="phone"
              [(ngModel)]="user.phone"
              placeholder="01xxxxxxxxx"
              maxlength="11"
              autocomplete="tel"
              inputmode="numeric"
              class="w-full h-14 pr-11 pl-4 rounded-xl border border-gray-200 bg-gray-50 text-[#0D0D0B] placeholder-gray-400 outline-none transition-all focus:bg-white focus:border-[#F20D18] focus:ring-4 focus:ring-[#F20D18]/10"
            />

          </div>

        </div>

        <!-- Job -->
        <div>

          <label
            for="job"
            class="block text-sm font-bold text-[#0D0D0B] mb-2"
          >
            الوظيفة
          </label>

          <div class="relative">

            <i
              class="fa-solid fa-briefcase absolute right-4 top-1/2 -translate-y-1/2 text-[#F20D18]"
            ></i>

            <input
              id="job"
              type="text"
              name="job"
              [(ngModel)]="user.job"
              placeholder="مثال: مربي دواجن"
              class="w-full h-14 pr-11 pl-4 rounded-xl border border-gray-200 bg-gray-50 text-[#0D0D0B] placeholder-gray-400 outline-none transition-all focus:bg-white focus:border-[#F20D18] focus:ring-4 focus:ring-[#F20D18]/10"
            />

          </div>

        </div>

        <!-- Error -->
        @if (errorMessage) {

          <div
            class="flex items-center gap-3 p-3.5 rounded-xl bg-red-50 border border-red-200 text-red-600 text-sm"
          >

            <i class="fa-solid fa-circle-exclamation shrink-0"></i>

            <span>
              {{ errorMessage }}
            </span>

          </div>

        }

        <!-- Submit Button -->
        <button
          type="submit"
          [disabled]="loading"
          class="w-full h-14 mt-2 rounded-xl bg-[#F20D18] hover:bg-[#D90B15] active:scale-[0.98] disabled:opacity-60 disabled:cursor-not-allowed text-white font-extrabold text-base flex items-center justify-center gap-3 transition-all shadow-lg shadow-[#F20D18]/20"
        >

          @if (loading) {

            <i class="fa-solid fa-spinner fa-spin"></i>

            <span>
              جاري الدخول...
            </span>

          } @else {

            <span>
              دخول إلى الموقع
            </span>

            <i class="fa-solid fa-arrow-left"></i>

          }

        </button>

      </form>

      <!-- Security -->
      <div
        class="flex items-center justify-center gap-2 mt-6 text-xs text-gray-400"
      >

        <i class="fa-solid fa-shield-halved text-[#F20D18]"></i>

        <span>
          بياناتك محفوظة بأمان
        </span>

      </div>

    </div>

    <!-- Bottom Brand Line -->
    <div class="h-1 bg-[#F20D18]"></div>

  </div>

</div>
